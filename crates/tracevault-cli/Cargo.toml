[package]
name = "tracevault-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "CLI tool for Visdom Trace - AI code tracing and attribution"
readme = "README.md"
keywords = ["tracing", "attribution", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "tracevault_cli"
path = "src/lib.rs"

[[bin]]
name = "tracevault"
path = "src/main.rs"

[dependencies]
visdom-ai-tracing-protocol = { path = "../visdom-ai-tracing-protocol", version = "0.29" }
clap = { version = "4", features = ["derive"] }
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
# preserve_order: rewriting a hook file must keep the key order of the entries
# TraceVault does not own (VIS-1044).
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
open = "5"
dirs = "6"
# `preserve_order`: `TracevaultConfig::save` keeps a hand-edited config.toml's key order.
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
