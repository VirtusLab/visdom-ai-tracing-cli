[package]
name = "visdom-cli"
# Its own version, apart from the workspace's: `visdom` is the developer's
# entry point and is stable from 1.0, while `tracevault` it is shipped with
# keeps its 0.x line.
version = "1.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Visdom developer CLI: checks a project's Visdom wiring and launches the coding agent"
readme = "README.md"
keywords = ["visdom", "tracing", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "visdom_cli"
path = "src/lib.rs"

[[bin]]
name = "visdom"
path = "src/main.rs"

[dependencies]
# 0.29.6 is the first with the gateway session marker the capture hook reads.
tracevault-cli = { path = "../tracevault-cli", version = "0.29.7" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
base64 = "0.22"
chrono.workspace = true
uuid.workspace = true
dirs = "6"
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
