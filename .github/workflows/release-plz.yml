name: Release-plz

permissions:
  pull-requests: write
  contents: write
  actions: write

on:
  push:
    branches: [main]
  # Manual fallback: GitHub's push event sometimes does not fire after a
  # squash merge. If a merge to main produced no Release-plz run, start one
  # with `gh workflow run release-plz.yml --ref main` (see README "Releasing").
  # (A pull_request_target backup trigger used to cover this; GitHub blocks
  # that event by default in public repos from 2026-12-02.)
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    # Never run two releases at once: overlapping runs (e.g. a push run and a
    # manual dispatch) collide on `cargo publish` / tag creation ("Reference
    # already exists"), the job fails, and the binary+brew trigger below never
    # runs. Queue instead of cancelling so no release is dropped.
    concurrency:
      group: release-plz-release-main
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Trigger binary builds and Homebrew update
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The binary + Homebrew formula track tracevault-cli specifically.
          tag=$(echo '${{ steps.release-plz.outputs.releases }}' \
            | jq -r '.[] | select(.package_name == "tracevault-cli") | .tag')
          if [ -z "$tag" ]; then
            echo "No tracevault-cli release in this run; skipping binary build."
            exit 0
          fi
          echo "tracevault-cli released as tag: $tag"
          gh workflow run release-binaries.yml \
            --repo ${{ github.repository }} \
            --field tag="$tag"

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-main
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run release-plz
        uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
