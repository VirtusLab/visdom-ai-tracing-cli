# Keep the published binary's git tag clean (`v0.20.0`), so release assets are
# `tracevault-v0.20.0-<target>.tar.gz` (not `tracevault-tracevault-cli-v...`)
# and the Homebrew formula's download URLs stay tidy. visdom-ai-tracing-protocol gets
# its own prefixed tag so the two crates' tags never collide.
[[package]]
name = "tracevault-cli"
git_tag_name = "v{{ version }}"

[[package]]
name = "visdom-ai-tracing-protocol"
git_tag_name = "protocol-v{{ version }}"

# `visdom` is not published to crates.io (see its Cargo.toml) and has no tag or
# changelog of its own: it takes the workspace version and ships inside the
# tracevault-cli release archives. Note that a change touching only
# crates/visdom-cli therefore opens no release PR by itself.
[[package]]
name = "visdom-cli"
release = false
